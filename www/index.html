function mv(x,y){const Rr=ring.offsetWidth/2;let dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);if(d>Rr*.85){const k=(d-Rr*.85)/d;cx+=dx*k;cy+=dy*k;dx=x-cx;dy=y-cy}const r=st.getBoundingClientRect();ring.style.left=cx-r.left+'px';ring.style.top=cy-r.top+'px';kn.style.transform=`translate(${dx}px,${dy}px)`;dirs(dx,dy)}
st.addEventListener('pointerdown',e=>{if(sid!==null)return;e.preventDefault();sid=e.pointerId;st.setPointerCapture(sid);cx=e.clientX;cy=e.clientY;mv(cx,cy)});
st.addEventListener('pointermove',e=>{if(e.pointerId===sid)mv(e.clientX,e.clientY)});
const se=e=>{if(e.pointerId!==sid)return;sid=null;dirs(0,0);rest()};st.addEventListener('pointerup',se);st.addEventListener('pointercancel',se);
document.getElementById('mu').addEventListener('pointerdown',e=>{e.stopPropagation();ac();MG.gain.value=MG.gain.value?0:.5});
['pointerdown','keydown'].forEach(n=>addEventListener(n,()=>ac(),{once:true}));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',()=>{try{document.documentElement.requestFullscreen&&!document.fullscreenElement&&document.documentElement.requestFullscreen();screen.orientation.lock('landscape').catch(()=>{})}catch(e){}},{once:true});
</script></body></html>
